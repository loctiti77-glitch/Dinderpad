<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DinderPad</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
<script src="js/transition.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DinderPad">
</head>
<body class="app is-locked">

  <!-- Le DinderPad. Le chassis ne bouge jamais : seul son ecran change. -->
  <main class="pad-wrap">
    <div class="pad" data-pad-width="1612">

      <!-- Les deux faces de l'appareil, superposees au pixel pres -->
      <img class="pad-img pad-img--menu"   id="padMenu"   src="assets/pad-menu.webp"   alt="DinderPad">
      <img class="pad-img pad-img--screen" id="padScreen" src="assets/pad-screen.webp" alt="" aria-hidden="true">

      <!-- La carte d'acces, qui vient s'inserer dans l'appareil -->
      <img class="lock-card" id="lockCard" src="assets/accesscard.webp"
           alt="Carte d'acces DinderPad">

      <!-- Accueil : les rubriques dessinees sur l'ecran -->
      <div class="menu" id="menu">
        <a class="hotspot" href="#dinders"     style="--x:18.89%; --y:21.21%; --w:31.37%; --h:17.56%;" aria-label="Dinders"><span>Dinders</span></a>
        <a class="hotspot" href="#items"       style="--x:51.71%; --y:21.21%; --w:28.78%; --h:17.56%;" aria-label="Items"><span>Items</span></a>
        <a class="hotspot" href="#credits"     style="--x:18.89%; --y:40.67%; --w:38.31%; --h:17.46%;" aria-label="Credits"><span>Cr&eacute;dits</span></a>
        <a class="hotspot" href="#win-dinders" style="--x:58.23%; --y:40.67%; --w:22.26%; --h:17.46%;" aria-label="Win Dinders"><span>Win Dinders</span></a>
        <a class="hotspot" href="#codanex"     style="--x:18.89%; --y:60.02%; --w:22.78%; --h:17.35%;" aria-label="Codanex"><span>Codanex</span></a>
        <a class="hotspot" href="#quests"      style="--x:41.98%; --y:60.02%; --w:12.63%; --h:17.35%;" aria-label="Quests"><span>Quests</span></a>
        <a class="hotspot" href="#badges"      style="--x:55.13%; --y:60.02%; --w:25.37%; --h:17.35%;" aria-label="Badges"><span>Badges</span></a>
      </div>

      <!-- Le flanc gauche, a l'accueil : la borne des mini-jeux -->
      <a class="nav-btn pad-arcade" href="#minijeux" aria-label="Mini-jeux">
        <span class="nav-btn-face">
          <!-- Une borne d'arcade : ecran, manche a balai et deux boutons. -->
          <svg class="nav-ico nav-ico--arcade" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"
               stroke-linecap="round" aria-hidden="true">
            <path d="M5 2.5h14a1.6 1.6 0 0 1 1.6 1.6v15.8A1.6 1.6 0 0 1 19 21.5H5a1.6 1.6 0 0 1-1.6-1.6V4.1A1.6 1.6 0 0 1 5 2.5z"/>
            <rect x="6" y="5.2" width="12" height="7" rx="1"
                  fill="currentColor" fill-opacity=".3"/>
            <path d="M9 18.4v-2.6"/>
            <circle cx="9" cy="15" r="1.5" fill="currentColor"/>
            <circle cx="14.4" cy="16.2" r="1.05" fill="currentColor"/>
            <circle cx="17" cy="18.2" r="1.05" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-label">Mini-jeux</span>
      </a>

      <!-- L'engrenage du flanc droit reste accessible en permanence -->
      <a class="hotspot hotspot--gear" href="#settings"
         style="--x:89.71%; --y:13.43%; --w:7.77%; --h:12.62%;"
         aria-label="Param&egrave;tres"><span>Param&egrave;tres</span></a>

      <!-- L'ecran des rubriques : son contenu est construit par js/views.js -->
      <div class="screen" id="screen">
        <div class="view" id="view"></div>

        <!-- Identification : c'est le pad lui-meme qui demande le code -->
        <div class="lock" id="lock">
          <p class="lock-title">Identifiez-vous</p>
          <div class="lock-form">
            <div class="lock-boxes" id="lockBoxes" aria-hidden="true"></div>
            <input class="lock-input" id="lockInput" type="text" inputmode="numeric"
                   pattern="[0-9]*" maxlength="8" autocomplete="one-time-code"
                   spellcheck="false" aria-label="Code d'acces a 8 chiffres">
            <p class="lock-msg" id="lockMsg">&nbsp;</p>
          </div>
          <p class="lock-welcome">Bienvenue patron</p>
        </div>
      </div>

      <nav class="pad-nav" id="padNav">
        <button class="nav-btn" type="button" data-pad-back aria-label="Retour">
          <span class="nav-btn-face">
            <svg class="nav-ico nav-ico--back" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="3.2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12H5.5"/><path d="M12 4.5 4.5 12 12 19.5"/>
            </svg>
          </span>
          <span class="nav-label">Retour</span>
        </button>
        <a class="nav-btn" href="#" data-pad-home aria-label="Accueil">
          <span class="nav-btn-face">
            <!-- Un DinderPad vierge : corps biseaute a gauche, ecran vide. -->
            <svg class="nav-ico nav-ico--home" viewBox="0 0 32 20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M5.5 1H29a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5.5L1 14.5v-9z"/>
              <rect x="8.5" y="4.2" width="19" height="11.6" rx="1.6"
                    fill="currentColor" fill-opacity=".28"/>
              <path d="M29.6 7.4h1.2M29.6 12.6h1.2"/>
            </svg>
          </span>
          <span class="nav-label">Accueil</span>
        </a>
      </nav>

    </div>
  </main>

  <script src="js/dinderpad.js"></script>
  <script src="js/pad.js"></script>
  <script src="js/views.js"></script>
  <script src="js/game-palettes.js"></script>
  <script src="js/game-sprites.js"></script>
  <script src="js/game-monde.js"></script>
  <script src="js/game-poissons.js"></script>
  <script src="js/founder-war.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/router.js"></script>
  <script src="js/access.js"></script>
</body>
</html>
