<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cr&eacute;dits &ndash; DinderPad</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/transition.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icon/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DinderPad">
</head>
<body class="home">

  <main class="pad-wrap">
    <div class="pad" data-pad-width="1612">
      <img src="../assets/dinderspage.png" alt="Ecran Credits" class="pad-img">

      <!-- Ecran fixe : 4 cases, pas de defilement -->
      <div class="screen">
        <div class="screen-scroll is-static">
          <a class="slot slot--credit" href="#" data-credit="green">
            <img class="credit-card" src="../assets/credits/green.png" alt="Carte de credit verte">
            <span class="credit-text">
              <strong class="credit-name">Cr&eacute;dit Universel</strong>
              <span class="credit-units">3 unit&eacute;s</span>
            </span>
          </a>
          <a class="slot slot--credit" href="#" data-credit="blue">
            <img class="credit-card" src="../assets/credits/blue.png" alt="Carte de credit bleue">
            <span class="credit-text">
              <strong class="credit-name">Cr&eacute;dit Multiversel</strong>
              <span class="credit-units">5 unit&eacute;s</span>
            </span>
          </a>
          <a class="slot slot--credit" href="#" data-credit="gold">
            <img class="credit-card" src="../assets/credits/gold.png" alt="Carte de credit doree">
            <span class="credit-text">
              <strong class="credit-name">Cr&eacute;dit Omniversel</strong>
              <span class="credit-units">10 unit&eacute;s</span>
            </span>
          </a>
          <a class="slot slot--credit" href="#" data-credit="pink">
            <img class="credit-card" src="../assets/credits/pink.png" alt="Carte de credit rose">
            <span class="credit-text">
              <strong class="credit-name">Cr&eacute;dit Temporel</strong>
              <span class="credit-units">20 unit&eacute;s</span>
            </span>
          </a>
        </div>
      </div>

      <nav class="pad-nav">
        <button class="nav-btn" type="button" data-nav="back" aria-label="Retour">
          <span class="nav-btn-face">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12H5"/><path d="M12 5l-7 7 7 7"/>
            </svg>
          </span>
          <span class="nav-label">Retour</span>
        </button>
        <a class="nav-btn" href="../index.html" aria-label="Accueil">
          <span class="nav-btn-face">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="3"  y="3"  width="8" height="8" rx="2"/>
              <rect x="13" y="3"  width="8" height="8" rx="2"/>
              <rect x="3"  y="13" width="8" height="8" rx="2"/>
              <rect x="13" y="13" width="8" height="8" rx="2"/>
            </svg>
          </span>
          <span class="nav-label">Accueil</span>
        </a>
      </nav>
    </div>
  </main>

  <script src="../js/pad.js"></script>
</body>
</html>
