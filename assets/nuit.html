<title>Animatroniques de Nuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: the player's view as the stage, character picker and actions below like a control desk */
:root{
  --room:#070605; --panel:#14110d; --line:#2e2820; --ink:#d9d2c3; --muted:#8a8172;
  --pick:#e8d6a8; --alarm:#ff2a2a; --amber:#ffb340;
  --crt:"VT323","Courier New",monospace; --mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
body{background:var(--room);color:var(--ink);font-family:var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.view{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 360px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.ch img{height:74px;width:auto;filter:grayscale(.6) brightness(.7)}
.ch span{font-family:var(--crt);font-size:19px;letter-spacing:.04em}
.ch[aria-pressed="true"]{border-color:var(--pick)}
.ch[aria-pressed="true"] img{filter:none}
.ch[aria-pressed="true"] span{color:var(--pick)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;flex:2 1 420px}
button.b{font:inherit;font-family:var(--crt);font-size:20px;letter-spacing:.05em;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column}
button.b small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
button.b:hover{border-color:var(--amber)}
button.b[aria-pressed="true"]{border-color:var(--pick);color:var(--pick)}
button.scare{color:var(--alarm)} button.scare:hover{border-color:var(--alarm)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.note{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
</style>

<div class="wrap">
  <div class="view"><canvas id="cv" width="1280" height="720" aria-label="Vue du joueur"></canvas></div>
  <div class="row">
    <div class="chars" id="chars"></div>
    <div class="acts">
      <button class="b" data-s="hall" aria-pressed="true">Couloir<small>Approche · 1</small></button>
      <button class="b" data-s="door">Porte<small>Lampe torche · 2</small></button>
      <button class="b scare" data-s="scare">Jumpscare<small>· Espace</small></button>
      <button class="b" id="night" aria-pressed="false">Nuit complète<small>Enchaînement auto · N</small></button>
    </div>
  </div>
  <div class="note"><span>Porte : maintiens le clic sur l'image (ou la touche L) pour allumer la lampe.</span><span>Q / W / E / R : changer d'animatronique</span></div>
</div>

 {id:'bird', name:'L’Oiseau',eyes:[[470,212]],face:[440,265],bottom:1453,eyeCol:'255,60,60',mouth:{y:300,x0:330,x1:520,h:90,hx:525}},

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1280,H=720;

let cur=0, scene='hall', st=0, night=false, lightHeld=false, S={};
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function syncNight(){nightBtn.setAttribute('aria-pressed',night)}
function go(s){scene=s;st=0;S={step:0,sparks:[],rot:0,rotT:0,tw:0,ox:0,oy:0};

// ---------- helpers ----------
const [shade,sx]=mk(), [fc,fx]=mk(), [tc,tx]=mk();
const grain=[...Array(4)].map(()=>{const c=document.createElement('canvas');c.width=320;c.height=180;const x=c.getContext('2d'),id=x.createImageData(320,180);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0);return c});
function charT(c,cx,footY,h,rot){const s=h/1536;return {c,cx,footY,s,rot:rot||0,
  pt(p){let x=(p[0]-512)*s,y=(p[1]-c.bottom)*s;const co=Math.cos(this.rot),si=Math.sin(this.rot);return [cx+x*co-y*si,footY+x*si+y*co]}}}
function drawChar(T,g=ctx,jaw=0){const {c,cx,footY,s,rot}=T;if(!c.img.complete)return;
  g.save();g.translate(cx,footY);g.rotate(rot);g.scale(s,s);g.translate(-512,-c.bottom);
  if(jaw<=0){g.drawImage(c.img,0,0,1024,1536);g.restore();return}
  const m=c.mouth,mx=(m.x0+m.x1)/2,rx=(m.x1-m.x0)/2+26;
  const jawPath=()=>{g.beginPath();g.moveTo(mx+rx,m.y);g.ellipse(mx,m.y,rx,m.h,0,0,Math.PI);g.closePath()};
  // mouth cavity behind
  const gr=g.createLinearGradient(0,m.y-10,0,m.y+jaw+10);gr.addColorStop(0,'#000');gr.addColorStop(.6,'#0d0101');gr.addColorStop(1,'#000');
  g.fillStyle=gr;g.beginPath();g.ellipse(mx,m.y+jaw*.4,rx*.82,jaw*.5+8,0,0,6.29);g.fill();
  // upper skull: everything except jaw shape
  g.save();g.beginPath();g.rect(-3000,-3000,7000,7000);g.moveTo(mx+rx,m.y);g.ellipse(mx,m.y,rx,m.h,0,0,Math.PI);g.closePath();g.clip('evenodd');g.drawImage(c.img,0,0,1024,1536);g.restore();
  // lower jaw, dropped and hinged
  g.save();g.translate(m.hx,m.y);g.rotate(-jaw*.0007);g.translate(-m.hx,-m.y+jaw*.8);jawPath();g.clip();g.drawImage(c.img,0,0,1024,1536);g.restore();
  g.restore()}
function glow(x,y,r,col,a,g=ctx){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.4,`rgba(${col},${a*.35})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
function eyes(T,a,size=1,g=ctx){if(a<=0)return;g.save();g.globalCompositeOperation='lighter';
  for(const e of T.c.eyes){const [x,y]=T.pt(e);const r=Math.max(2,T.s*22)*size;glow(x,y,r*5,T.c.eyeCol,a*.5,g);g.fillStyle=`rgba(255,255,255,${a})`;g.beginPath();g.arc(x,y,r*.35,0,6.29);g.fill()}g.restore()}
function darkness(level,lights,g=ctx){
  sx.globalCompositeOperation='source-over';sx.clearRect(0,0,W,H);sx.fillStyle=`rgba(0,0,0,${level})`;sx.fillRect(0,0,W,H);
  sx.globalCompositeOperation='destination-out';for(const [x,y,r,k] of lights){const gr=sx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${k})`);gr.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=gr;sx.fillRect(x-r,y-r,2*r,2*r)}
  g.drawImage(shade,0,0)}
function film(a){ctx.save();ctx.globalAlpha=a;ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='overlay';ctx.drawImage(grain[(Math.random()*4)|0],0,0,W,H);ctx.restore()}
function vignette(a){const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function floor(hy,col1,col2,g=ctx){const vx=W/2;for(let r=0;r<14;r++){const z0=r/14,z1=(r+1)/14,y0=hy+(H-hy)*z0*z0,y1=hy+(H-hy)*z1*z1;
  for(let c=-12;c<12;c++){g.fillStyle=(r+c)&1?col1:col2;g.beginPath();const w0=(W*1.6)*z0*z0/12,w1=(W*1.6)*z1*z1/12;
    g.moveTo(vx+c*w0,y0);g.lineTo(vx+(c+1)*w0,y0);g.lineTo(vx+(c+1)*w1,y1);g.lineTo(vx+c*w1,y1);g.fill()}}}
function tear(n,amp){for(let i=0;i<n;i++){const y=rnd(0,H),h=rnd(3,30);ctx.drawImage(cv,0,y,W,h,rnd(-amp,amp),y,W,h)}}

// ---------- couloir ----------
function sceneHall(dt){
  const c=CH[cur],vx=W/2,vy=H*.42,bw=170,bh=230;
  S.fl=(S.fl??1);S.ft=(S.ft??1.2)-dt;
  if(S.ft<=0){ if(S.fl){S.fl=0;S.ft=rnd(.3,.7);S.step=(S.step+1)%5} else {S.fl=1;S.ft=S.step>=4?rnd(1.6,2.2):rnd(.9,1.6)} }
  const lit=S.fl?(Math.random()<.06?.35:1):0;
  ctx.fillStyle='#0d0b09';ctx.fillRect(0,0,W,H);
  const poly=(pts,f)=>{ctx.fillStyle=f;ctx.beginPath();ctx.moveTo(...pts[0]);pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.fill()};
  poly([[0,0],[vx-bw,vy-bh/2],[vx-bw,vy+bh/2],[0,H]],'#2a221a');poly([[W,0],[vx+bw,vy-bh/2],[vx+bw,vy+bh/2],[W,H]],'#241d16');
  poly([[0,0],[W,0],[vx+bw,vy-bh/2],[vx-bw,vy-bh/2]],'#120f0c');
  ctx.save();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(vx-bw,vy+bh/2);ctx.lineTo(vx+bw,vy+bh/2);ctx.lineTo(W,H);ctx.clip();floor(vy+bh/2-40,'#2f2a22','#151310');ctx.restore();
  ctx.fillStyle='#050403';ctx.fillRect(vx-bw,vy-bh/2,bw*2,bh);
  for(let i=0;i<4;i++){const k=i/4;ctx.fillStyle='rgba(255,240,200,.05)';ctx.fillRect(40+k*(vx-bw-60),vy-bh*(1.6-k*1.1),60*(1-k)+20,90*(1-k)+30)}
  const steps=[[vy+bh/2,150],[vy+bh/2+60,240],[vy+bh/2+150,380],[H*1.05,640],[H*1.6,1300]];
  const p=steps[S.step];const T=charT(c,vx+(S.step%2?18:-12),p[0],p[1],(S.step%2?.02:-.02));
  drawChar(T);
  // ceiling light
  if(lit){ctx.save();ctx.globalCompositeOperation='lighter';glow(vx,vy-bh*.9,260,'255,235,190',.12*lit);ctx.restore()}
  darkness(lit?.78:.985,lit?[[vx,vy-bh*.4,720,.9*lit]]:[]);
  eyes(T,lit?.3:.95,1+S.step*.15);
  film(.18);vignette(.75);
  if(night&&st>7)go('door');
}

// ---------- porte ----------
function drawDoor(g,on,T,eyeA){
  const dx=W*.5,dw=520,dtop=H*.08;
  g.fillStyle='#0b0907';g.fillRect(0,0,W,H);
  g.fillStyle='#1d1813';g.fillRect(0,0,dx-dw/2,H);g.fillRect(dx+dw/2,0,W,H);g.fillRect(0,0,W,dtop);
  g.fillStyle='#000';g.fillRect(dx-dw/2,dtop,dw,H);
  if(T){g.save();g.beginPath();g.rect(dx-dw/2,dtop,dw,H);g.clip();drawChar(T,g);g.restore()}
  g.strokeStyle='#3a3026';g.lineWidth=14;g.strokeRect(dx-dw/2,dtop,dw,H);
  g.fillStyle='#120f0b';g.fillRect(0,H*.86,W,H*.14);g.fillStyle='#2b241b';g.fillRect(0,H*.86,W,6);
  darkness(on?.55:.975,on?[[dx,H*.42,420,1],[dx,H*.42,180,1]]:[],g);
  if(on){g.save();g.globalCompositeOperation='lighter';glow(dx,H*.42,420,'255,230,170',.1,g);g.restore()}
  if(T)eyes(T,eyeA??(on?.2:.95),1.4,g);
}
function sceneDoor(dt){
  const c=CH[cur];
  S.at=(S.at??0)-dt; if(S.at<=0){S.auto=!S.auto;S.at=S.auto?rnd(.6,1.4):rnd(.5,1.1)}
  let on=lightHeld||S.auto; if(on&&Math.random()<.08)on=false;
  const T=charT(c,W*.5+Math.sin(st*.7)*6,H*1.06,740,Math.sin(st*.9)*.01);
  drawDoor(ctx,on,T);
  ctx.save();ctx.font='30px VT323, monospace';ctx.fillStyle='rgba(255,179,64,.85)';ctx.textBaseline='top';ctx.fillText(on?'LAMPE : ON':'LAMPE : OFF',40,30);ctx.restore();
  film(.16);vignette(.8);
  if(night&&st>4.5)go('scare');
}

// ---------- jumpscare ----------
// A 0-1.1s  : lampe qui lâche, il est déjà dans l'encadrement, plus près à chaque flash
// B 1.1-1.24: il se jette sur toi (flou de mouvement, flash)
// C 1.24-2.5: gros plan, mâchoire qui claque, tête qui saccade comme un servomoteur, étincelles
// D 2.5-2.62: dernière poussée dans la gueule, puis noir
const TA=1.1,TB=1.24,TC=2.5,TD=2.62;
function sceneScare(dt){
  const c=CH[cur], t=st;
  if(t<TA){
    // flicker build-up: dark with eyes, strobe reveals him closer each time
    const strobe=(t>.35&&t<.42)||(t>.72&&t<.77)||(t>.98&&t<1.02);
    const q=Math.pow(t/TA,3),h=760+q*1000,fy=156+q*110,foot=fy-(c.face[1]-c.bottom)*h/1536;
    const T=charT(c,W*.5+(t>.7?rnd(-4,4):0),foot,h,t>.72?.05:0);
    drawDoor(ctx,strobe,T,strobe?.3:1);
    ctx.save();ctx.font='30px VT323, monospace';ctx.fillStyle='rgba(255,179,64,.85)';ctx.textBaseline='top';ctx.fillText(strobe?'LAMPE : ON':'LAMPE : ...',40,30);ctx.restore();
    film(.2);vignette(.85);return;
  }
  if(t>=TD){gameOver(t-TD);return}

  // servo twitch: snaps to a new head angle every ~0.12-0.22s
  S.tw-=dt;if(S.tw<=0){S.tw=rnd(.1,.22);S.rotT=rnd(-.11,.11);S.oyT=rnd(-30,30);S.oxT=rnd(-40,40)}
  S.rot+=(S.rotT-S.rot)*Math.min(1,dt*28);S.ox+=(S.oxT-S.ox)*Math.min(1,dt*22);S.oy+=(S.oyT-S.oy)*Math.min(1,dt*22);

  let h,jaw,shake;
  if(t<TB){const u=(t-TA)/(TB-TA);h=1500+Math.pow(u,2.2)*1500;jaw=u*45;shake=10+u*30}
  else if(t<TC){const u=(t-TB)/(TC-TB);h=3000+u*450+Math.sin(t*9)*60;
    const ch=Math.abs(Math.sin(t*Math.PI*6.5));jaw=15+Math.pow(ch,.6)*55;h+=Math.pow(ch,4)*260;S.rotT+=(Math.random()-.5)*.02*ch;shake=34*(1-u*.5)}
  else {const u=(t-TC)/(TD-TC);h=3450+u*4000;jaw=70+u*20;shake=50}
  if(reduce){shake*=.3}
  const jx=rnd(-shake,shake)+Math.sin(t*41)*shake*.4, jy=rnd(-shake,shake)*.8;

  // compose the face into fc
  fx.setTransform(1,0,0,1,0,0);fx.globalCompositeOperation='source-over';fx.fillStyle='#030101';fx.fillRect(0,0,W,H);
  const s=h/1536,f=c.face,rot=S.rot+(t<TB?.05:0);
  const co=Math.cos(rot),si=Math.sin(rot),fxo=(f[0]-512)*s,fyo=(f[1]-c.bottom)*s;
  const cx=W/2+S.ox+jx-(fxo*co-fyo*si), footY=H*.47+S.oy+jy-(fxo*si+fyo*co);
  const T=charT(c,cx,footY,h,rot);
  drawChar(T,fx);
  // harsh flashlight from below + falloff
  darkness(.5,[[W/2+S.ox*.3,H*.55,860,1],[W/2,H*.5,320,.6]],fx);
  eyes(T,1,.35,fx);

  // chromatic aberration
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const ab=(t<TB?18:10)+Math.random()*12;
  for(const [col,dx] of [['#ff0000',-ab],['#00ffff',ab]]){
    tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);tx.drawImage(fc,0,0);
    tx.globalCompositeOperation='multiply';tx.fillStyle=col;tx.fillRect(0,0,W,H);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.drawImage(tc,dx,0);ctx.restore()}
  // motion blur on the lunge and final push
  if(t<TB+.06||t>TC){for(let i=1;i<=5;i++){const k=1-i*.045;ctx.save();ctx.globalAlpha=.16;ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.drawImage(fc,-W/2,-H/2);ctx.restore()}}

  // sparks from the jaw joints
  if(t>TB&&Math.random()<.5){const m=c.mouth;const [px,py]=T.pt([Math.random()<.5?m.x0:m.x1,m.y]);
    for(let i=0;i<8;i++)S.sparks.push({x:px+rnd(-20,20),y:py+rnd(-20,20),vx:rnd(-14,14),vy:rnd(-16,4),life:rnd(.2,.45)})}
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const p of S.sparks){p.life-=dt;p.vy+=60*dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;ctx.strokeStyle=`rgba(255,${200+Math.random()*55|0},140,${clamp(p.life*3,0,1)})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.6,p.y-p.vy*1.6);ctx.stroke()}
  ctx.restore();S.sparks=S.sparks.filter(p=>p.life>0);

  // impact flash, red pulses, tearing, grain
  if(t<TB+.05&&t>TB-.03){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(0,0,W,H)}
  const pulse=Math.pow(Math.abs(Math.sin(t*Math.PI*6.5)),8);
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgba(255,${60-pulse*50|0},${60-pulse*50|0},1)`;ctx.globalAlpha=.25+pulse*.45;ctx.fillRect(0,0,W,H);ctx.restore();
  if(Math.random()<.35)tear(4,40);
  film(.28);vignette(.9);
  // light dying: random blackout frames
  if(Math.random()<.04){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,W,H)}
}
function gameOver(u){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(u<.6)return; // a beat of pure black
  const a=clamp((u-.6)/.8,0,1);
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.fillStyle='#b01010';ctx.font='96px VT323, monospace';ctx.fillText('GAME OVER',W/2+(Math.random()<.05?rnd(-6,6):0),H/2);
  ctx.font='30px VT323, monospace';ctx.fillStyle='rgba(217,210,195,.75)';ctx.fillText(`${CH[cur].name} t'a trouvé.`,W/2,H/2+50);
  ctx.fillText('Clique pour recommencer',W/2,H/2+90);ctx.restore();film(.12);
  if(night&&u>3){pick((cur+1)%CH.length);go('hall')}
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;st+=dt;
  ctx.save();({hall:sceneHall,door:sceneDoor,scare:sceneScare})[scene](dt);ctx.restore();requestAnimationFrame(loop)}
go('hall');requestAnimationFrame(loop);

// ---------- input ----------
cv.addEventListener('pointerdown',()=>{if(scene==='scare'&&st>TD+1){go('door');return}lightHeld=true});
addEventListener('pointerup',()=>lightHeld=false);addEventListener('pointercancel',()=>lightHeld=false);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='l'){lightHeld=true;e.preventDefault();return} if(e.repeat)return;
  const m={'1':'hall','2':'door',' ':'scare'}[k];if(m){e.preventDefault();night=false;syncNight();go(m);return}
  const ci={q:0,w:1,e:2,r:3}[k];if(ci!==undefined){pick(ci);return}
  if(k==='n')nightBtn.click()});
addEventListener('keyup',e=>{if(e.key.toLowerCase()==='l')lightHeld=false});
</script>
