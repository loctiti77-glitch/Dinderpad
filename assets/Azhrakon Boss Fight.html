<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Azhrakon Boss Fight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Chakra+Petch:wght@400;500;600&display=swap">
<style>
/* Layout: arena canvas as the stage, HUD plate on top, move list below like a fight-pad */
:root{
  --void:#05061a; --deep:#0b0f3a; --ink:#e8ecff; --muted:#8d97d6;
  --cyan:#3fd6ff; --rage:#ff3b5c; --gold:#ffd36b; --line:rgba(120,140,255,.22);
  --display:"Syncopate","Arial Black",system-ui,sans-serif;
  --body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stage{position:relative;width:100%;aspect-ratio:3/2;max-width:100%;border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,var(--deep),var(--void) 70%);border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;padding:2.2% 4%;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.plate{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:clamp(13px,2.3vw,24px);text-shadow:0 0 18px rgba(63,214,255,.7)}
.sub{font-size:clamp(10px,1.3vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sub b{color:var(--cyan);font-weight:600}
body.rage .sub b{color:var(--rage)}
.bar{position:relative;height:clamp(8px,1.4vw,14px);background:rgba(0,0,20,.7);border:1px solid rgba(160,180,255,.4);transform:skewX(-18deg)}
.bar i{position:absolute;inset:0;transform-origin:left;}
.bar .lag{background:var(--gold);transition:transform .9s .35s ease-out}
.bar .hp{background:linear-gradient(90deg,#1f5bff,var(--cyan));transition:transform .15s}
body.rage .bar .hp{background:linear-gradient(90deg,#8a0b3a,var(--rage))}
.bar .tick{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.6)}
.banner{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-weight:700;
  font-size:clamp(18px,4.4vw,48px);letter-spacing:.3em;pointer-events:none;opacity:0;transition:opacity .4s}
.banner.on{opacity:1}
.banner small{display:block;font-family:var(--body);font-size:clamp(11px,1.4vw,15px);letter-spacing:.24em;color:var(--muted);margin-top:8px;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button{font:inherit;color:var(--ink);background:linear-gradient(180deg,rgba(40,52,140,.55),rgba(14,18,60,.8));
  border:1px solid var(--line);border-radius:4px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .1s}
button:hover{border-color:var(--cyan)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button span{font-weight:600;font-size:14px}
button em{font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button kbd{font-family:var(--body);font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:3px;padding:0 5px;align-self:flex-start;margin-bottom:2px}
button.hit span{color:var(--gold)} button.danger span{color:var(--rage)}
button[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" width="1536" height="1024" aria-label="Animation du boss Azhrakon"></canvas>
    <div class="hud">
      <div class="plate"><div class="name">AZHRAKON</div><div class="sub">Phase <b id="phase">I · Le Veilleur</b></div></div>
      <div class="bar"><i class="lag" id="lag"></i><i class="hp" id="hp"></i><span class="tick"></span></div>
      <div class="sub" id="move">—</div>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="pad" id="pad">
    <button data-a="auto" id="autoBtn" aria-pressed="true"><kbd>A</kbd><span>Combat auto</span><em>Pattern du boss</em></button>
    <button data-a="charge"><kbd>1</kbd><span>Convergence</span><em>Charge</em></button>
    <button data-a="palms"><kbd>2</kbd><span>Salve stellaire</span><em>Attaque · projectiles</em></button>
    <button data-a="beam"><kbd>3</kbd><span>Regard du néant</span><em>Attaque · rayon</em></button>
    <button data-a="slam"><kbd>4</kbd><span>Effondrement</span><em>Attaque · onde de choc</em></button>
    <button data-a="hit" class="hit"><kbd>Espace</kbd><span>Frapper le boss</span><em>Coup reçu · −8 PV</em></button>
    <button data-a="rage" class="danger"><kbd>5</kbd><span>Éveil cosmique</span><em>Phase 2 · rage</em></button>
    <button data-a="death" class="danger"><kbd>6</kbd><span>Chute</span><em>Mort · désintégration</em></button>
    <button data-a="reset"><kbd>R</kbd><span>Recommencer</span><em>PV pleins</em></button>
  </div>
  <div class="foot"><span>Le passage en phase 2 se déclenche à 50 % PV, la mort à 0.</span><span>Clavier : 1–6, Espace, A, R</span></div>
</div>

  const mk=(fn)=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);fn(x);return c};
  white=mk(x=>{x.globalCompositeOperation='source-atop';x.fillStyle='#fff';x.fillRect(0,0,W,H)});
  red=mk(x=>{x.globalCompositeOperation='color';x.fillStyle='#ff1f4a';x.fillRect(0,0,W,H);x.globalCompositeOperation='destination-in';x.drawImage(img,0,0,W,H)});
  ready=true;
};

// ---------- state ----------
let hp=100, rage=false, dead=false, auto=true;
let state={name:'idle',t:0,dur:Infinity};
let parts=[], projs=[], rings=[], beams=[];
let shake=0, flash=0, flashCol='255,255,255', spriteAlpha=1, rageAmt=0, hurt=0;
let tf={x:0,y:0,s:1,sy:1,r:0}; // current sprite transform
const bg=[...Array(160)].map(()=>({x:Math.random()*W,y:Math.random()*H*0.8,r:Math.random()*1.6+.3,p:Math.random()*6}));

const $=id=>document.getElementById(id);
const MOVES={idle:'—',charge:'Convergence',palms:'Salve stellaire',beam:'Regard du néant',slam:'Effondrement',hit:'Touché !',rage:'Éveil cosmique',death:'Chute'};
const DUR={charge:1.6,palms:2.2,beam:2.8,slam:2.3,hit:.55,rage:3.2,death:6.5};

function setState(n){
  if(dead && n!=='reset') return;
  if(state.name==='rage'||state.name==='death') { if(n!=='hit'&&n!=='death') return; if(state.name==='death') return; }
  state={name:n,t:0,dur:DUR[n]??Infinity,fired:0,flag:{}};
  $('move').textContent=MOVES[n]||'—';
  if(n==='rage'){rage=true;document.body.classList.add('rage');$('phase').textContent='II · Le Dévoreur';banner('ÉVEIL COSMIQUE','Azhrakon libère sa vraie puissance')}
  if(n==='death'){dead=true;hp=0;updHP();banner('',' ')}
}
function banner(t,s){const b=$('banner');b.innerHTML=t?`${t}<small>${s}</small>`:'';b.classList.toggle('on',!!t);clearTimeout(b._t);if(t)b._t=setTimeout(()=>b.classList.remove('on'),2200)}
function updHP(){$('hp').style.transform=`scaleX(${hp/100})`;$('lag').style.transform=`scaleX(${hp/100})`}

function hitBoss(){
  if(dead||state.name==='death')return;
  hp=Math.max(0,hp-8);updHP();
  if(state.name!=='rage') { const keep=state; setState('hit'); }
  hurt=1; flash=Math.max(flash,.25); flashCol='255,255,255'; shake=Math.max(shake,14);
  const c=world(P.chest); burst(c[0]+rnd(-120,120),c[1]+rnd(-140,60),26,rage?'255,90,120':'160,230,255',9);
  if(hp<=0){setTimeout(()=>setState('death'),350)}
  else if(hp<=50&&!rage){setTimeout(()=>{if(!dead)setState('rage')},450)}
}
function reset(){hp=100;rage=false;dead=false;rageAmt=0;spriteAlpha=1;parts=[];projs=[];rings=[];beams=[];document.body.classList.remove('rage');$('phase').textContent='I · Le Veilleur';banner('','');updHP();state={name:'idle',t:0,dur:Infinity};setState('idle');patIdx=0;idleWait=1.2}

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function world(p){ // sprite point -> world with current transform
  let x=p[0]-P.pivot[0],y=p[1]-P.pivot[1];
  x*=tf.s;y*=tf.s*tf.sy;
  const c=Math.cos(tf.r),s=Math.sin(tf.r);
  return [P.pivot[0]+tf.x+x*c-y*s, P.pivot[1]+SPR_Y+tf.y+x*s+y*c];
}
function part(o){parts.push(Object.assign({vx:0,vy:0,life:1,max:1,size:3,col:'160,230,255',drag:.98,g:0,add:true},o))}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(2,sp);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,.9),max:.9,size:rnd(2,5),col})}}
const accent=()=>rage?'255,70,110':'90,210,255';
const accent2=()=>rage?'255,180,120':'190,240,255';

// ---------- state logic ----------
let patIdx=0, idleWait=1.5;
const PATTERN=['charge','palms','beam','charge','slam'];

function logic(dt){
  const S=state; S.t+=dt; const t=S.t, k=t/S.dur;
  const spd=rage?1.6:1;
  let x=0,y=0,s=1,sy=1,r=0;
  // idle breathing always underneath
  const T=performance.now()/1000*spd;
  y+=Math.sin(T*1.7)*7; sy+=Math.sin(T*1.7+1)*.006; r+=Math.sin(T*.8)*.006;

  switch(S.name){
    case 'idle':
      if(auto&&!dead){idleWait-=dt*(rage?1.5:1); if(idleWait<=0){setState(PATTERN[patIdx++%PATTERN.length]); idleWait=rage?.6:1.1}}
      break;
    case 'charge':{
      const e=Math.sin(Math.PI*clamp(k,0,1));
      s+=e*.025; y+=e*14; shake=Math.max(shake,e*3);
      for(const h of [P.lHand,P.rHand]){const w=world(h);
        for(let i=0;i<(rage?5:3);i++){const a=Math.random()*6.28,d=rnd(160,320);
          part({x:w[0]+Math.cos(a)*d,y:w[1]+Math.sin(a)*d,tx:w[0],ty:w[1],conv:true,life:.6,max:.6,size:rnd(2,4),col:accent2()})}}
      break;}
    case 'palms':{
      if(t<.35){const e=ease(t/.35); s+=e*.03; y-=e*16}
      else {const e=1-ease(clamp((t-.35)/1.6,0,1)); s+=e*.03; y-=e*16; x+=Math.sin(t*30)*e*3}
      const n=rage?10:6, gap=1.3/n;
      while(S.fired<n && t>.4+S.fired*gap){
        const h=S.fired%2?P.rHand:P.lHand, w=world(h);
        projs.push({sx:w[0],sy:w[1],tx:rnd(W*.15,W*.85),ty:rnd(H*.55,H*.95),z:0,spd:rnd(.9,1.2)*(rage?1.3:1)});
        burst(w[0],w[1],14,accent2(),7); shake=Math.max(shake,4); S.fired++;
      }
      break;}
    case 'beam':{
      if(t<1){const e=ease(t); s+=e*.02; r+=-e*.03; y+=e*8;
        const v=world(P.visor); for(let i=0;i<4;i++){const a=Math.random()*6.28,d=rnd(120,300);part({x:v[0]+Math.cos(a)*d,y:v[1]+Math.sin(a)*d,tx:v[0],ty:v[1],conv:true,life:.5,max:.5,size:rnd(1.5,3.5),col:accent2()})}
      } else if(t<2.3){const u=(t-1)/1.3; r=-.03+u*.06; y+=8; x+=Math.sin(t*50)*2; s+=.02;
        S.aim=[W*(.12+u*.76),H*.92]; shake=Math.max(shake,7);
        if(Math.random()<.9){part({x:S.aim[0]+rnd(-30,30),y:S.aim[1],vx:rnd(-4,4),vy:rnd(-9,-3),g:.25,life:.8,max:.8,size:rnd(2,5),col:accent2()})}
      } else {S.aim=null; const e=1-ease((t-2.3)/.5); r=.03*e; s+=.02*e}
      break;}
    case 'slam':{
      if(t<.8){const e=ease(t/.8); y-=e*70; s+=e*.06; sy+=e*.02}
      else if(t<1){const u=(t-.8)/.2; y=-70+u*u*115; s+=.06*(1-u); sy-=u*.05}
      else {const e=1-ease(clamp((t-1)/1.1,0,1)); y+=45*e; sy-=.05*e;
        if(!S.flag.hit){S.flag.hit=1; shake=34; flash=.35; flashCol=accent();
          for(let i=0;i<3;i++) rings.push({x:W/2,y:H*.93,r:40+i*30,v:1500-i*300,life:1,w:20-i*5});
          for(let i=0;i<70;i++) part({x:rnd(W*.2,W*.8),y:H*.95,vx:rnd(-7,7),vy:rnd(-22,-8),g:.6,drag:.99,life:rnd(.8,1.4),max:1.4,size:rnd(3,7),col:accent2()});
          for(let i=0;i<(rage?40:24);i++) part({x:rnd(0,W),y:rnd(-200,0),vx:rnd(-1,1),vy:rnd(14,24),drag:1,life:1.5,max:1.5,size:rnd(2,4),col:'255,255,255',streak:true});
        }}
      break;}
    case 'hit':{const e=1-k; x+=Math.sin(t*60)*16*e; r+=.025*e; s-=.015*e; y+=6*e; break;}
    case 'rage':{
      const e=clamp(t/2.2,0,1); shake=Math.max(shake,4+e*16); x+=Math.sin(t*70)*6*e; s+=e*.04; y-=e*20;
      rageAmt=Math.min(1,e*1.1);
      const c=world(P.chest); if(Math.random()<.8) part({x:c[0]+rnd(-500,500),y:c[1]+rnd(-200,400),vy:rnd(-6,-2),vx:rnd(-1,1),life:1,max:1,size:rnd(3,7),col:'255,70,110'});
      if(t>2.2&&!S.flag.roar){S.flag.roar=1; flash=.6; flashCol='255,60,100'; shake=40;
        rings.push({x:c[0],y:c[1],r:60,v:1800,life:1,w:30});rings.push({x:c[0],y:c[1],r:20,v:1200,life:1,w:16});
        burst(c[0],c[1],90,'255,120,140',22)}
      if(t>2.2){const e2=1-ease((t-2.2)/1);s+=.04*e2;y-=20*e2}
      break;}
    case 'death':{
      if(t<3){const e=t/3; shake=Math.max(shake,6+e*22); x+=Math.sin(t*55)*10*e; r+=Math.sin(t*3)*.03*e; y+=e*30; sy-=e*.03;
        const c=world(P.chest); if(Math.random()<.6+e*.4){S.rays=S.rays||[]; if(S.rays.length<14) S.rays.push({a:Math.random()*6.28,w:rnd(.04,.12)})}
        if(Math.random()<.5) burst(c[0]+rnd(-300,300),c[1]+rnd(-300,300),6,accent2(),6);
      } else if(!S.flag.boom){S.flag.boom=1; flash=1; flashCol='255,255,255'; shake=50; dissolve(); spriteAlpha=0;
        const c=world(P.chest); rings.push({x:c[0],y:c[1],r:40,v:2200,life:1,w:40});
      }
      if(t>4.2&&!S.flag.ban){S.flag.ban=1;banner('VAINCU','Azhrakon retourne au néant · R pour recommencer')}
      if(t>=S.dur) S.dur=Infinity;
      break;}
  }
  if(S.t>=S.dur && S.name!=='death'){ if(S.name==='rage'){state={name:'idle',t:0,dur:Infinity}} setState('idle'); }

  if(rage&&!dead){const c=world(P.chest); if(Math.random()<.5) part({x:c[0]+rnd(-480,480),y:c[1]+rnd(-100,450),vy:rnd(-5,-2),vx:rnd(-.5,.5),life:1,max:1,size:rnd(2,6),col:Math.random()<.5?'255,60,100':'255,170,90',drag:.99})}
  // ambient motes
  if(!dead&&Math.random()<.35) part({x:rnd(W*.15,W*.85),y:H+10,vy:rnd(-3,-1),life:2.5,max:2.5,size:rnd(1,2.5),col:accent2(),drag:1});

  tf={x,y,s,sy,r};
}

function dissolve(){
  const st=7, c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  let d; try{d=x.getImageData(0,0,W,H).data}catch(e){return}
  const ch=world(P.chest);
  for(let yy=0;yy<H;yy+=st)for(let xx=0;xx<W;xx+=st){const i=(yy*W+xx)*4; if(d[i+3]<120)continue;
    const w=world([xx,yy]); const dx=w[0]-ch[0],dy=w[1]-ch[1],dist=Math.hypot(dx,dy)+1;
    parts.push({x:w[0],y:w[1],vx:dx/dist*rnd(1,6)+rnd(-1,1),vy:dy/dist*rnd(1,6)-rnd(1,3),g:-.04,drag:.985,life:rnd(1.4,3),max:3,size:st*.9,col:`${d[i]},${d[i+1]},${d[i+2]}`,add:false,sq:true,delay:dist/900});
  }
}

// ---------- render ----------
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.35,`rgba(${col},${a*.45})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}

function render(dt){
  const T=performance.now()/1000;
  ctx.setTransform(1,0,0,1,0,0);
  // background
  const bgG=ctx.createRadialGradient(W/2,H*.38,50,W/2,H*.45,W*.75);
  bgG.addColorStop(0,rage?`rgb(${40+rageAmt*30},10,40)`:'#10175a'); bgG.addColorStop(1,'#03040f');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  for(const s of bg){ctx.fillStyle=`rgba(200,215,255,${.25+.35*Math.sin(T*1.3+s.p)**2})`;ctx.fillRect(s.x,s.y,s.r,s.r)}

  // camera shake
  const sh=reduce?shake*.25:shake; ctx.translate(rnd(-sh,sh),rnd(-sh,sh)); shake*=Math.pow(.02,dt);

  ctx.globalCompositeOperation='lighter';
  // aura behind boss
  const ch=world(P.chest), pulse=.5+.5*Math.sin(T*(rage?6:2.4));
  if(spriteAlpha>0){glow(ch[0],ch[1]-60,620,accent(),.16+pulse*.06+rageAmt*.12);}
  // rings
  for(const g of rings){g.r+=g.v*dt;g.life-=dt*1.1;ctx.strokeStyle=`rgba(${accent2()},${Math.max(0,g.life)})`;ctx.lineWidth=g.w*g.life;ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*(g.y>H*.8?.18:1),0,0,6.29);ctx.stroke()}
  rings=rings.filter(g=>g.life>0);
  ctx.globalCompositeOperation='source-over';

  // sprite
  if(ready&&spriteAlpha>0){
    ctx.save();
    ctx.translate(P.pivot[0]+tf.x,P.pivot[1]+SPR_Y+tf.y);ctx.rotate(tf.r);ctx.scale(tf.s,tf.s*tf.sy);ctx.translate(-P.pivot[0],-P.pivot[1]);
    ctx.globalAlpha=spriteAlpha; ctx.drawImage(img,0,0,W,H);
    if(rageAmt>0){ctx.globalAlpha=rageAmt*(.5+.12*pulse);ctx.drawImage(red,0,0)}
    if(hurt>0){ctx.globalAlpha=hurt*.85;ctx.drawImage(white,0,0)}
    ctx.restore(); ctx.globalAlpha=1;
  }
  hurt=Math.max(0,hurt-dt*4);

  // floor fog hides sprite bottom
  const fg=ctx.createLinearGradient(0,H*.78,0,H);fg.addColorStop(0,'rgba(3,4,15,0)');fg.addColorStop(1,'rgba(3,4,15,.95)');ctx.fillStyle=fg;ctx.fillRect(-60,H*.78,W+120,H*.3);

  ctx.globalCompositeOperation='lighter';
  if(spriteAlpha>0){
    // energy points on the body
    const v=world(P.visor), b=world(P.belt);
    const vA=state.name==='beam'&&state.t<2.3?.9:.35+pulse*.2;
    glow(v[0],v[1],state.name==='beam'?260*Math.min(1,state.t+.2):110,accent2(),vA);
    glow(ch[0],ch[1],150+pulse*30,accent(),.35+pulse*.25);
    glow(b[0],b[1],90,accent(),.25+pulse*.2);
    const charging=state.name==='charge'||state.name==='palms';
    for(const h of [P.lHand,P.rHand]){const w=world(h);
      const amt=state.name==='charge'?Math.min(1,state.t/1.2):state.name==='palms'?Math.max(0,1-state.t/2):0;
      glow(w[0],w[1]-20,60+amt*150+(charging?Math.sin(T*25)*8:0),accent2(),.15+amt*.6);
    }
    // death rays
    if(state.name==='death'&&state.rays){for(const ry of state.rays){ctx.save();ctx.translate(ch[0],ch[1]);ctx.rotate(ry.a+Math.sin(T)*.05);
      const L=1600,gr=ctx.createLinearGradient(0,0,L,0);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,`rgba(${accent()},0)`);
      ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L,-L*ry.w);ctx.lineTo(L,L*ry.w);ctx.fill();ctx.restore()}}
    // beam
    if(state.name==='beam'&&state.aim){const v2=world(P.visor),a=state.aim;
      for(const [w,al] of [[70,.25],[34,.5],[12,1]]){ctx.strokeStyle=`rgba(${w===12?'255,255,255':accent2()},${al})`;ctx.lineWidth=w+Math.sin(T*60)*w*.15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(v2[0],v2[1]);ctx.lineTo(a[0],a[1]);ctx.stroke()}
      glow(a[0],a[1],220,accent2(),.8); glow(v2[0],v2[1],180,'255,255,255',.6);
      beams.push({x:a[0],y:a[1],life:1.4});
    }
  }
  // scorch trail
  for(const s of beams){s.life-=dt;glow(s.x,s.y,50,accent(),Math.max(0,s.life)*.12)} beams=beams.filter(s=>s.life>0);

  // projectiles flying toward viewer
  for(const p of projs){p.z+=dt*p.spd;const z=Math.min(1,p.z),e=z*z;
    const x=p.sx+(p.tx-p.sx)*e,y=p.sy+(p.ty-p.sy)*e,r=14+e*120;
    glow(x,y,r*2.2,accent(),.55);glow(x,y,r*.9,'255,255,255',.8);
    if(Math.random()<.7)part({x:x+rnd(-r,r)*.4,y:y+rnd(-r,r)*.4,life:.35,max:.35,size:rnd(2,4)+e*6,col:accent2()});
    if(p.z>=1&&!p.done){p.done=1;flash=Math.max(flash,.3);flashCol=accent();shake=Math.max(shake,16);burst(x,y,40,accent2(),16)}}
  projs=projs.filter(p=>!p.done);

  // particles
  for(const p of parts){
    if(p.delay>0){p.delay-=dt; ctx.globalCompositeOperation='source-over'; ctx.fillStyle=`rgb(${p.col})`; ctx.fillRect(p.x,p.y,p.size,p.size); continue}
    p.life-=dt;
    if(p.conv){p.x+=(p.tx-p.x)*Math.min(1,dt*7);p.y+=(p.ty-p.y)*Math.min(1,dt*7)}
    else{p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60}
    const a=Math.max(0,p.life/p.max);
    ctx.globalCompositeOperation=p.add?'lighter':'source-over';
    ctx.fillStyle=`rgba(${p.col},${a})`;
    if(p.streak){ctx.fillRect(p.x,p.y,p.size*.6,p.size*14)}
    else if(p.sq){ctx.fillRect(p.x,p.y,p.size*a+1,p.size*a+1)}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.29);ctx.fill()}
  }
  parts=parts.filter(p=>p.life>0);
  if(parts.length>9000)parts.splice(0,parts.length-9000);

  // screen flash
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';
  if(flash>0){ctx.fillStyle=`rgba(${flashCol},${flash*(reduce?.3:1)})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*1.6)}
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,rage?'rgba(60,0,15,.6)':'rgba(0,0,10,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;logic(dt);render(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
updHP();

// ---------- controls ----------
function act(a){
  if(a==='auto'){auto=!auto;$('autoBtn').setAttribute('aria-pressed',auto);return}
  if(a==='reset')return reset();
  if(a==='hit')return hitBoss();
  if(a==='rage'){if(!rage&&!dead){hp=Math.min(hp,50);updHP();setState('rage')}return}
  if(a==='death'){if(!dead){setState('death')}return}
  if(state.name==='idle'||state.name==='hit'||state.t>.4) setState(a);
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});
$('stage').addEventListener('pointerdown',()=>act('hit'));
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  const m={'1':'charge','2':'palms','3':'beam','4':'slam','5':'rage','6':'death',' ':'hit','a':'auto','A':'auto','r':'reset','R':'reset'}[e.key];
  if(m){e.preventDefault();act(m)}});
</script>

</body></html>
